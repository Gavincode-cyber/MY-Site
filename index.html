<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Plxgx</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fullscreen splash overlay - click to enter -->
    <div id="splashOverlay" class="splash-overlay" role="button" aria-label="Enter site">
        <div class="splash-content">
            <h1 id="splashText">CLICK TO ENTER</h1>
            <p class="splash-sub">Click anywhere or press Enter</p>
        </div>
    </div>
    <div class="container">
        <!-- (welcome banner removed) -->

        <!-- mute button removed -->

        <!-- Profile Section -->
        <div class="profile-container">
            <!-- Avatar -->
                <div class="avatar-wrap">
                    <img src="https://cdn.discordapp.com/attachments/1298029292264886334/1528916278671315095/IMG_5415.png" alt="Avatar Image" class="avatar" id="avatar">
                </div>

            <!-- Profile Info -->
            <div class="profile-info">
                <h2 id="profileName">OnlyPlxgx</h2>

                <!-- Status -->
                <div class="status">
                    <span class="status-indicator"></span>
                    <span id="statusText">Twitch/Youtube</span>
                </div>
            </div>
        </div>

        <!-- Social Links -->
        <div class="social-buttons" id="socialButtons">
            <button class="social-btn" data-platform="Website" title="Website"></button>
            <button class="social-btn" data-platform="Discord" title="Discord">
            </button>
            <button class="social-btn" data-platform="Instagram" title="Instagram">
            </button>
            <button class="social-btn" data-platform="Roblox" title="Roblox">
            </button>
            <button class="social-btn" data-platform="Steam" title="Steam">
            </button>
            <button class="social-btn" data-platform="Twitch" title="Twitch">
            </button>
            <button class="social-btn" data-platform="YouTube" title="YouTube">
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
